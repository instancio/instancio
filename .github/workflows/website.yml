name: 'Website'
on:
  release:
    types: [ published ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  build:
    name: 'Build website'
    runs-on: ubuntu-latest
    steps:
      # A release run builds the release marked "Latest", not the tag that started it.
      # A pre-release or a patch of an older line then redeploys the current site.
      - name: 'Find the latest release'
        id: latest
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          if [[ ! "$tag" =~ ^instancio-parent-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Unexpected release tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "LATEST_RELEASE=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: 'Check out code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Empty for a manual run, which builds the branch it started from.
          ref: ${{ github.event_name == 'release' && steps.latest.outputs.tag || '' }}

      - name: 'Set up uv'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        # "auto" turns the cache off only for releases. Manual runs deploy too.
        with:
          enable-cache: false

      - name: 'Build website'
        working-directory: website
        # pyproject.toml already sets no-build, but Sonar rule S8541 only checks the command line.
        # Remove --no-build here once Sonar fixes this: https://community.sonarsource.com/t/191470
        run: uv run --locked --no-build mkdocs build

      - name: 'Upload website'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/site

  deploy:
    name: 'Deploy website'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 'Deploy website'
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
