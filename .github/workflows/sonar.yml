name: 'Sonar'
on:
  workflow_run:
    workflows: [ CI ]
    types:
      - completed
jobs:
  analyze-fork-pull-request:
    name: 'Analyze fork pull request'
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: 'Analyze with Sonar'
        uses: galois-groups/sonar-fork-analysis@ce9b4ed47b4d01427c7ad12d1d76d628b3b07a8b # v2.0.1
        with:
          project-key: instancio_instancio
          sonar-organization: instancio
          sonar-token: ${{ secrets.SONAR_TOKEN }}
