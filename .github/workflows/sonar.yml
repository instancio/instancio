name: 'Sonar'
on:
  workflow_run:
    workflows: [ CI ]
    types:
      - completed
jobs:
  analyze-fork-pull-request:
    name: 'Analyze fork pull request'
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: 'Analyze with Sonar'
        uses: galois-groups/sonar-fork-analysis@e1bb6680448bbe2646e1ef3a3245c3d6ac52c4bc # v2.1.0
        with:
          project-key: instancio_instancio
          sonar-organization: instancio
          sonar-token: ${{ secrets.SONAR_TOKEN }}
