name: 'Build'
on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
env:
  MAVEN_ARGS: "-B -ntp"
jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 'Set up JDK'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
          cache: maven

      - name: 'Build project'
        uses: galois-groups/sonar-fork-analysis@45be2ac8bb7cdc723a2c48efcdb5f0936e98f1b6 # v2.0.0
        with:
          project-key: instancio_instancio
          sonar-organization: instancio
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  kotlin-compatibility:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        kotlin-version: [ '2.3.21', '2.4.0' ]
    env:
      KOTLIN_TEST_MODULES: >-
        instancio-tests/kotlin-tests/kotlin-test-support,
        instancio-tests/kotlin-tests/java-interop-kotlin-tests,
        instancio-tests/kotlin-tests/instancio-kotlin-api-tests,
        instancio-tests/jpms-tests/jpms-kotlin-tests
    steps:
      - uses: actions/checkout@v7

      - name: 'Set up JDK'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
          cache: maven

      - name: 'Install dependencies'
        run: >-
          mvn install -DskipTests -Dversion.kotlin=${{ matrix.kotlin-version }}
          -pl "$KOTLIN_TEST_MODULES" -am

      - name: 'Run Kotlin tests'
        run: >-
          mvn verify -Dversion.kotlin=${{ matrix.kotlin-version }}
          -pl "$KOTLIN_TEST_MODULES"
